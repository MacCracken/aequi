[package]
name = "aequi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "aequi"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
aequi-core = { path = "../core" }
aequi-storage = { path = "../storage" }
aequi-ocr = { path = "../ocr" }
aequi-email = { path = "../email" }
# Devtools are compiled into debug builds only (tauri's default without the
# `devtools` feature).
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
serde.workspace = true
serde_json = { workspace = true }
tokio.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
sqlx.workspace = true
directories = "6"
tracing.workspace = true
tracing-subscriber.workspace = true
notify = { workspace = true }
tauri-plugin-updater = "2.13"
tauri-plugin-notification = "2.6"

[dev-dependencies]
tempfile = "3.27"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Real OCR via Tesseract (needs system libtesseract + libleptonica). Without
# it, receipts are stored with no recognized text for manual review.
tesseract = ["aequi-ocr/tesseract"]
