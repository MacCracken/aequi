[workspace]
members = [
    "crates/core",
    "crates/storage",
    "crates/app",
    "crates/import",
    "crates/ocr",
    "crates/pdf",
    "crates/email",
    "crates/mcp",
    "crates/server",
]
resolver = "3"

[workspace.package]
version = "2026.3.18"
edition = "2024"
rust-version = "1.94"
authors = ["Robert MacCracken <robert.maccracken@gmail.com>"]
license = "MIT OR AGPL-3.0"
repository = "https://github.com/anomalyco/aequi"

[workspace.dependencies]
rust_decimal = { version = "1.43", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53", features = ["full"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "macros", "chrono", "rust_decimal"] }
sha2 = "0.11"
hex = "0.4.3"
image = "0.25.10"
notify = "8.2"
regex = "1.13"
toml = "1.1"
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7", features = ["cors", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1.28", features = ["v4"] }
flate2 = "1.1.10"
tar = "0.4.46"
