name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-env
        with:
          cache-prefix: quality

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Prepare sidecar binary
        run: |
          cargo build -p aequi-mcp
          mkdir -p crates/app/binaries
          cp target/debug/aequi-mcp crates/app/binaries/aequi-mcp-x86_64-unknown-linux-gnu

      - name: Prepare frontend dist for Tauri compile check
        run: mkdir -p dist

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: TypeScript check
        run: npx tsc --noEmit

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-env
        with:
          cache-prefix: security

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit || echo "::warning::cargo audit found advisories"
        continue-on-error: true

      - name: Check outdated deps
        run: |
          cargo install cargo-outdated --locked
          cargo outdated --root-deps-only
        continue-on-error: true

  test:
    name: Test (${{ matrix.package }}${{ matrix.features && format(' +{0}', matrix.features) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: aequi-core
          - package: aequi-storage
          - package: aequi-import
          - package: aequi-ocr
          - package: aequi-pdf
          - package: aequi-email
          - package: aequi-server
          - package: aequi-mcp
          - package: aequi-mcp
            features: sse
          - package: aequi
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-env
        with:
          cache-prefix: test

      # The Tauri app's build script needs the sidecar binary and a dist/ dir.
      - name: Prepare Tauri build inputs
        if: matrix.package == 'aequi'
        run: |
          cargo build -p aequi-mcp
          mkdir -p crates/app/binaries dist
          cp target/debug/aequi-mcp crates/app/binaries/aequi-mcp-x86_64-unknown-linux-gnu

      - name: Run tests
        run: cargo test --package ${{ matrix.package }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-env
        with:
          cache-prefix: coverage

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked

      # LLVM engine (-C instrument-coverage) rather than the default ptrace engine,
      # whose -C link-dead-code breaks crates with compile-time size assertions.
      - name: Run coverage
        run: |
          cargo tarpaulin --workspace \
            --engine llvm \
            --exclude aequi \
            --fail-under 45 \
            --timeout 300 \
            --out xml \
            --skip-clean

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cobertura.xml
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-env
        with:
          cache-prefix: build

      - name: Build frontend
        run: npm run build

      - name: Build MCP sidecar binary
        run: |
          cargo build -p aequi-mcp
          mkdir -p crates/app/binaries
          cp target/debug/aequi-mcp crates/app/binaries/aequi-mcp-x86_64-unknown-linux-gnu

      - name: Build Rust workspace
        run: cargo build --workspace

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-env
        with:
          cache-prefix: docs
          install-tauri-deps: 'true'

      - name: Check required docs
        run: |
          for f in README.md LICENSE CHANGELOG.md; do
            if [ ! -f "$f" ]; then
              echo "Missing required doc: $f"
              exit 1
            fi
          done

      - name: Prepare sidecar for doc build
        run: |
          cargo build -p aequi-mcp
          mkdir -p crates/app/binaries
          cp target/debug/aequi-mcp crates/app/binaries/aequi-mcp-x86_64-unknown-linux-gnu

      - name: Prepare frontend dist for Tauri compile check
        run: mkdir -p dist

      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

  license:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify license
        run: |
          if [ ! -f "LICENSE" ]; then
            echo "LICENSE file is missing"
            exit 1
          fi
