# Aequi Tax Rules — United States — Tax Year 2026
#
# Sources:
#   - IRS Revenue Procedure 2025-32 (2026 inflation adjustments)
#   - SSA 2026 contribution and benefit base
#   - IRS 2026 standard mileage rates announcement
#
# IMPORTANT: This file is informational only. Always consult a CPA
# for your specific tax situation. Aequi does not provide tax advice.

[year]
value = 2026

[se_tax]
ss_rate = 0.124              # Social Security: 12.4% (employer + employee)
medicare_rate = 0.029         # Medicare: 2.9% (employer + employee)
ss_wage_base = 184500         # 2026 Social Security wage base (SSA)
net_earnings_factor = 0.9235  # Net earnings = net_profit × 0.9235
deductible_fraction = 0.50    # 50% of SE tax is deductible from AGI
min_net_earnings = 400        # No SE tax when net earnings are below $400
additional_medicare_rate = 0.009      # Additional Medicare Tax (not deductible)
additional_medicare_threshold = 200000  # Single filer threshold (not indexed)

[standard_deduction]
single = 16100               # 2026 single filer (Rev. Proc. 2025-32)

# Single filer 2026 ordinary income brackets (Rev. Proc. 2025-32)
