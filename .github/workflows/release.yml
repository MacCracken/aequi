name: Release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].*'

permissions:
  contents: write
  packages: write
  id-token: write
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  # Builds upload into a draft release, which is published only after every
  # platform and the SBOM are attached, so the updater's latest.json never
  # points at a half-finished release.
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs: ci-gate
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check updater signing is configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$(jq -r '.plugins.updater.pubkey // ""' crates/app/tauri.conf.json)" ]; then
            echo "::error::plugins.updater.pubkey in crates/app/tauri.conf.json is empty; installed apps could not verify this release's updates."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY repository secret is not set."
            exit 1
          fi

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${{ github.ref_name }}" ]; then
            CHANGELOG=$(git log --oneline --no-decorate)
          else
            CHANGELOG=$(git log --oneline --no-decorate "${PREV_TAG}..HEAD")
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Aequi ${{ steps.version.outputs.version }}
          draft: true
          prerelease: false
          body: |
            ## Aequi ${{ steps.version.outputs.version }}

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Downloads
            | Platform | Installer |
            |----------|-----------|
            | macOS (Apple silicon) | `.dmg` |
            | Windows x64 | `-setup.exe` (NSIS) or `.msi` |
            | Linux x64 | `.AppImage`, `.deb` or `.rpm` |

            Installed apps update themselves from this release (signed `latest.json`).

            ### Verification
            `SHA256SUMS.txt` lists a SHA-256 checksum for every asset.

            ---
            *Estimates are informational only. Aequi does not provide tax advice.*

  build-release:
    name: Build Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install frontend deps
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      # Bundled next to the app (bundle.externalBin) for users' MCP clients.
      - name: Build MCP sidecar binary
        shell: bash
        run: |
          cargo build -p aequi-mcp --release --target ${{ matrix.target }}
          EXT=$([ "${{ runner.os }}" = "Windows" ] && echo ".exe" || echo "")
          mkdir -p crates/app/binaries
          cp "target/${{ matrix.target }}/release/aequi-mcp${EXT}" \
            "crates/app/binaries/aequi-mcp-${{ matrix.target }}${EXT}"

      # Builds the installers (the app's beforeBuildCommand builds the frontend),
      # signs the updater bundles, and uploads them plus latest.json to the draft.
      # Pinned to a commit because this step receives the update-signing key.
      - name: Build, sign and upload
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: ci-gate
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-env
        with:
          cache-prefix: sbom

      - name: Install SBOM tools
        run: |
          cargo install cargo-cyclonedx --locked
          cargo install cargo-license --locked

      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx --format json --override-filename aequi-sbom
          cargo cyclonedx --format xml --override-filename aequi-sbom

      - name: Generate license report
        run: |
          cargo license --json > aequi-licenses.json
          cargo license > aequi-licenses.txt

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            aequi-sbom.*
            aequi-licenses.*
          retention-days: 90

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [create-release, build-release, generate-sbom]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom/

      - name: Attach SBOM and checksums
        run: |
          gh release upload "$TAG" sbom/* --clobber
          mkdir assets
          gh release download "$TAG" --dir assets --skip-existing
          (cd assets && rm -f SHA256SUMS.txt && sha256sum -- * > ../SHA256SUMS.txt)
          gh release upload "$TAG" SHA256SUMS.txt --clobber

      # A normal (non-pre) release marked latest: the updater endpoint is
      # releases/latest/download/latest.json, which skips drafts and prereleases.
      - name: Publish
        run: gh release edit "$TAG" --draft=false --prerelease=false --latest
